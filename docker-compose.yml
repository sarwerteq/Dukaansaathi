version: "3.8"
services:
  dukaansaathi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_secret}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4000}
      - DATABASE_FILE=/app/backend/data/dukaansaathi.db
    volumes:
      - ds_data:/app/backend/data
    restart: unless-stopped

volumes:
  ds_data:
